name: LeetCode Auto Sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leetcode-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run LeetCode sync
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sync.py

      - name: Commit and push solutions
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No new changes to commit."
            exit 0
          fi

          git diff --cached --name-only > /tmp/changed-files.txt

          git commit -m "Add new LeetCode solutions"

          # Integrate the latest remote changes.
          git fetch origin main
          git rebase origin/main

          # Push only after a successful rebase.
          git push origin HEAD:main

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "New changes pushed successfully."

      - name: Notify Discord
        if: steps.commit.outputs.has_changes == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import requests

          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          repository = os.environ["REPOSITORY"]

          if not webhook:
              raise RuntimeError(
                  "DISCORD_WEBHOOK_URL secret is missing."
              )

          with open("/tmp/changed-files.txt", encoding="utf-8") as f:
              files = [
                  line.strip()
                  for line in f
                  if line.strip()
              ]

          content = (
              "🚀 **LeetCode repository updated!**\n"
              f"📦 Repository: `{repository}`\n"
              f"📝 Changed files: {len(files)}\n"
              + "\n".join(f"• `{name}`" for name in files[:15])
              + (
                  f"\n...and {len(files) - 15} more files."
                  if len(files) > 15 else ""
              )
              + "\n🤖 Your progress tracker can now process these changes."
          )

          response = requests.post(
              webhook,
              json={"content": content},
              timeout=20,
          )
          response.raise_for_status()

          print("Discord notification sent successfully.")
          PY
